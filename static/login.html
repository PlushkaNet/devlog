<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
        <style>
            main {
                display: flex;
                align-items: center;
                justify-self: center;
                min-height: 100vh;
                padding: 1rem;
            }
            form {
                width: 100%;
                max-width: 400px;
            }
        </style>
    </head>
    <body>
        <main>
            <form method="post" action="/">
                <hgroup>
                    <h1>Good morning</h1>
                    <p>Enter a secret</p>
                </hgroup>
                <input type="text" placeholder="page" name="page" required autofocus>
                <input type="password" placeholder="secret" name="secret" required>
                <button type="submit">Log in</button>
            </form>
        </main>
    </body>
</html>
